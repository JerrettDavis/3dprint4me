# Private financial feed. Reuses the read-only machine credential, never outbound delivery credentials.
rest:
  - resource: https://3dprint4.me/api/home-assistant-work?resource=billing
    method: GET
    headers:
      Authorization: !secret three_d_print_work_authorization
    scan_interval: 60
    timeout: 10
    sensor:
      - name: Three D Print Billing
        unique_id: three_d_print_billing
        value_template: "{{ value_json.sync.status }}"
        json_attributes:
          - generatedAt
          - sync
          - counts
          - totals
          - items
          - needsInvoicing
          - tax
