name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Rehearse native PostgreSQL setup, backup and rebuild in isolation
        run: python tests/integration/platform_recovery_docker.py

      - name: Rehearse pinned Restic stream copy and readback with synthetic data
        run: |
          curl --fail --location --silent --show-error https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 --output "$RUNNER_TEMP/restic.bz2"
          bzip2 --decompress --stdout "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          chmod 700 "$RUNNER_TEMP/restic"
          python tests/integration/restic_stream_recovery.py --restic "$RUNNER_TEMP/restic"

      - name: Install Node dependencies
        run: npm ci

      - name: Verify partner PostgreSQL isolation, concurrency and restore
        run: npm run test:partner:postgres

      - name: Verify work communications and model revisions on native PostgreSQL
        run: node --test tests/integration/work-communications-postgres.test.mjs

      - name: Verify guarded partner rollout in isolated native stack
        run: |
          python tests/integration/partner_archive_images.py
          python tests/integration/partner_rollout_docker.py --image 3dprint4me-partner-archive-ci-api --diagnostics "$RUNNER_TEMP/partner-rollout-synthetic.log"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify native partner sessions, records and budget authorizations
        run: npm run test:partner:browser

      - name: Run validation, unit, E2E, and UX audit
        run: npm test

      - name: Generate screenshots
        run: npm run screenshots

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 3dprint4me-verification
          path: |
            screenshots/
            docs/UX-AUDIT.md
            docs/ux-audit.json
          if-no-files-found: warn
