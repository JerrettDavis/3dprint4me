name: Print Estimate Cleanup

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run estimate cleanup
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          set +e
          npm run estimate:cleanup 2>&1 | tee cleanup.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "Project storage is temporarily unavailable" cleanup.log; then
            echo "::warning::Neon reported 'Project storage is temporarily unavailable' (compute quota or suspension); cleanup skipped and will retry on the next run."
            exit 0
          fi
          exit "$status"
