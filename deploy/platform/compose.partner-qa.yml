name: 3dprint4me-partner-qa
services:
  partner-qa-postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    env_file: ["${PARTNER_QA_CONFIG_DIR:?Private QA configuration required}/postgres.env"]
    restart: unless-stopped
    user: "999:999"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/run/postgresql:size=1m,uid=999,gid=999"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [postgres, -c, max_connections=24, -c, shared_buffers=64MB, -c, password_encryption=scram-sha-256, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes: [qa-postgres18:/var/lib/postgresql]
    networks: [database]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 96
    healthcheck: {test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'], interval: 10s, timeout: 5s, retries: 6}
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  partner-qa-jobs:
    image: ${PARTNER_QA_API_IMAGE:?Reviewed immutable API image required}
    env_file: ["${PARTNER_QA_CONFIG_DIR:?Private QA configuration required}/jobs.env"]
    command: [node, scripts/partner-qa-jobs.mjs]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    networks: [database]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
networks:
  database: {external: true, name: 3dprint4me-platform_database}
volumes:
  qa-postgres18: {}
