# Slicer worker for the always-on Docker host.
# Configuration comes ONLY from environment variables (no env_file), so the same file works for:
#   - Portainer: Stacks > Add stack > Repository, compose path deploy/slicer-worker/docker-compose.yml,
#     variables entered in the stack's "Environment variables" section (see docs/PRINT-ESTIMATION.md).
#   - CLI: put the values in deploy/slicer-worker/.env (git-ignored; see .env.worker.example) and run
#       docker compose -f deploy/slicer-worker/docker-compose.yml up -d --build
#     or pass --env-file <path>. Never commit real values.
# Build context ../.. is the repository root, which is what a Portainer git stack checks out.
services:
  slicer-worker:
    build:
      context: ../..
      # Bambu Studio CLI (default). For the PrusaSlicer image set SLICER_DOCKERFILE=Dockerfile
      # in the shell or a compose .env file, and use the PrusaSlicer block in .env.worker.
      dockerfile: deploy/slicer-worker/${SLICER_DOCKERFILE:-Dockerfile.bambu}
    image: 3dprint4me-slicer-worker:latest
    container_name: 3dprint4me-slicer-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}
      SLICER_PROVIDER: ${SLICER_PROVIDER:-bambu-cli}
      SLICER_ENGINE: ${SLICER_ENGINE:-bambu-studio-cli}
      SLICER_PROFILE_ID: ${SLICER_PROFILE_ID:-bambu-x2d-0.4-0.16hq-generic-v1}
      SLICER_TIMEOUT_MS: ${SLICER_TIMEOUT_MS:-300000}
      SLICER_POLL_MS: ${SLICER_POLL_MS:-15000}
      # Pass-through only when set; otherwise the image's baked ENV defaults apply (an empty string
      # here would override them). Bambu image bakes these; set them for PrusaSlicer (Dockerfile).
      SLICER_BIN:
      SLICER_PROFILE:
      SLICER_BED_TYPE:
      SLICER_FILAMENT_PROFILES:
    # No ports: the worker only makes outbound connections (Neon, Vercel Blob).
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/worker:size=64m,uid=10001,gid=10001,mode=0700
    # PrusaSlicer profile override: uncomment and point SLICER_PROFILE at /profiles/<file>.ini.
    # (Bambu presets are flattened at build time; see profiles/bambu/README.md.)
    # volumes:
    #   - ./profiles:/profiles:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
